name: VDRAW Installed Signature Inspector
on:
  push:
    branches: [work/vdraw007-signing-release-20261006]
    paths:
      - '.github/workflows/vdraw007-signature-inspector.yml'
      - 'tools/vdraw-signature-inspector/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: vdraw007-signature-inspector
  cancel-in-progress: false
jobs:
  build-inspector:
    if: github.repository == 'doudesyoupit-alt/dksc-camera-001-test' && github.ref == 'refs/heads/work/vdraw007-signing-release-20261006'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Source safety gate
        run: python3 tools/vdraw-signature-inspector/tools/verify.py source
      - name: Ensure inspector SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build inspection-only APK and tests
        run: gradle -p tools/vdraw-signature-inspector --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug
      - name: Verify actual APK identity, permissions, independent signer and tests
        run: |
          mkdir -p inspector-delivery
          cp tools/vdraw-signature-inspector/app/build/outputs/apk/debug/app-debug.apk inspector-delivery/VDRAW-SIGNATURE-CHECK-1.0.0.apk
          cp tools/vdraw-signature-inspector/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk inspector-delivery/inspector-test.apk
          python3 tools/vdraw-signature-inspector/tools/verify.py build
      - uses: actions/upload-artifact@v7
        with:
          name: inspector-build-${{ github.run_id }}
          path: inspector-delivery
          if-no-files-found: error
          retention-days: 30
  os-verification:
    needs: build-inspector
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: inspector-build-${{ github.run_id }}
          path: inspector-delivery
      - name: Obtain exact baseline as emulator-only fixture
        uses: actions/download-artifact@v7
        with:
          artifact-ids: '11333531784'
          repository: doudesyoupit-alt/dksc-camera-001-test
          run-id: '37283743856'
          github-token: ${{ github.token }}
          path: baseline-fixture
      - name: Fixture and source gate
        run: |
          python3 tools/vdraw-signature-inspector/tools/verify.py source
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          assert hashlib.sha256(Path('baseline-fixture/VDRAW-MOBILE-007-debug.apk').read_bytes()).hexdigest() == '89350a7e6d8471ba3bbe983dfaeefba477d6ad31519f1036105da5cf9af71d09'
          PY
      - name: Enable hosted-runner emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Formal OS API and real button tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tools/vdraw-signature-inspector/tools/emulator-test.sh ${{ matrix.api }}
      - name: Preserve OS evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: inspector-os-api${{ matrix.api }}-${{ github.run_id }}
          path: inspector-os-evidence
          if-no-files-found: error
          retention-days: 30
  accepted-delivery:
    needs: [build-inspector, os-verification]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: inspector-build-${{ github.run_id }}
          path: inspector-delivery
      - uses: actions/upload-artifact@v7
        with:
          name: VDRAW-SIGNATURE-CHECK-accepted-${{ github.run_id }}
          path: |
            inspector-delivery/VDRAW-SIGNATURE-CHECK-1.0.0.apk
            inspector-delivery/inspector-build-report.json
            inspector-delivery/APK-SHA256.txt
          if-no-files-found: error
          retention-days: 30
