name: VDRAW Photo Accuracy Preparation
on:
  push:
    branches: [work/vdraw007-photo-accuracy-20261006]
    paths:
      - 'prototype/vdraw-mobile-007/docs/photo-accuracy/**'
      - 'prototype/vdraw-mobile-007/scripts/photo-eval*'
      - 'prototype/vdraw-mobile-007/server/photo-eval-provider.mjs'
      - 'prototype/vdraw-mobile-007/tests/photo-eval*'
      - 'prototype/vdraw-mobile-007/tests/photo-pptx-audit.mjs'
      - '.github/workflows/vdraw007-photo-accuracy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vdraw-photo-evaluation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  evaluation-preparation:
    if: github.ref == 'refs/heads/work/vdraw007-photo-accuracy-20261006'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: prototype/vdraw-mobile-007
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Protect accepted product, existing tests, signing and 006
        run: |
          mkdir -p evidence/photo-accuracy
          python3 - <<'PY'
          import subprocess
          baseline='15bf3371bec3f7d1e4090e7198a850c5636baf3f'
          pin='47cabdf70e9aebf7c64a1e028e85c476df32a169'
          assert subprocess.check_output(['git','rev-parse','HEAD:prototype/vdraw-mobile-006'],text=True).strip()==pin
          allowed={'.github/workflows/vdraw007-photo-accuracy.yml',
          'prototype/vdraw-mobile-007/scripts/photo-eval.py','prototype/vdraw-mobile-007/scripts/photo-eval-metrics.py',
          'prototype/vdraw-mobile-007/scripts/photo-eval-requirements.txt','prototype/vdraw-mobile-007/server/photo-eval-provider.mjs',
          'prototype/vdraw-mobile-007/tests/photo-eval.test.py','prototype/vdraw-mobile-007/tests/photo-eval-metrics.test.py',
          'prototype/vdraw-mobile-007/tests/photo-eval-provider.test.mjs','prototype/vdraw-mobile-007/tests/photo-eval-png-fixture.json',
          'prototype/vdraw-mobile-007/tests/photo-pptx-audit.mjs'}
          changes=subprocess.check_output(['git','diff','--name-only',baseline,'HEAD'],text=True).splitlines()
          assert all(p in allowed or p.startswith('prototype/vdraw-mobile-007/docs/photo-accuracy/') for p in changes)
          assert not subprocess.check_output(['git','diff','--name-only','--diff-filter=DM',baseline,'HEAD'],text=True).strip()
          print('006 / accepted web-native-android / signing / old tests: PROTECTED_PASS')
          PY
      - name: Install pinned evaluation-only dependency
        run: timeout -k 5s 120s python3 -m pip install --disable-pip-version-check -r scripts/photo-eval-requirements.txt
      - name: Evaluate synthetic safety probes; not photo recognition accuracy
        run: |
          timeout -k 5s 90s python3 tests/photo-eval.test.py > evidence/photo-accuracy/safety-tests.log 2>&1
          timeout -k 5s 90s python3 tests/photo-eval-metrics.test.py > evidence/photo-accuracy/metrics-tests.log 2>&1
          timeout -k 5s 90s node --test tests/photo-eval-provider.test.mjs > evidence/photo-accuracy/provider-tests.log 2>&1
          timeout -k 5s 90s node --test tests/vision-provider.test.mjs tests/input-001-regression.test.mjs tests/save001.test.mjs > evidence/photo-accuracy/existing-contract-tests.log 2>&1
          timeout -k 5s 60s node tests/photo-pptx-audit.mjs > evidence/photo-accuracy/photo-pptx-defect-probe.json
      - name: Emit truthful first-trial readiness; zero network and no accuracy PASS
        run: |
          timeout -k 5s 30s node server/photo-eval-provider.mjs > evidence/photo-accuracy/provider-preflight.json
          timeout -k 5s 30s python3 scripts/photo-eval.py preflight --manifest docs/photo-accuracy/golden-manifest.json --output evidence/photo-accuracy > evidence/photo-accuracy/preflight.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('evidence/photo-accuracy/accuracy-report.json')
          r=json.loads(p.read_text())
          assert r['status']=='BLOCKED' and r['productReleaseAllowed'] is False
          assert r['realPhotoTotal']==r['realAIPhotoCount']==r['actualNetworkRequestsThisCommand']==0
          assert all(v is None for v in r['formalMetrics'].values())
          assert r['save001DeviceAcceptance']=='OPEN_PENDING_USER_EVIDENCE'
          print('Evaluation preparation complete; real-photo trial BLOCKED, accuracy NOT_MEASURED')
          PY
          cat evidence/photo-accuracy/accuracy-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve public preparation evidence only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: VDRAW-photo-accuracy-preparation-${{ github.run_id }}-${{ github.sha }}
          path: prototype/vdraw-mobile-007/evidence/photo-accuracy
          if-no-files-found: error
          retention-days: 30
